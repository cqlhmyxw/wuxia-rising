<!DOCTYPE html><html lang="zh-CN"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>江湖山庄</title>
<style>
*{margin:0;padding:0;border:0;box-sizing:border-box}
body{background:#87a5b8;overflow:hidden;font-family:'KaiTi','STKaiti',serif;user-select:none;-webkit-user-select:none}
#loading{position:fixed;inset:0;background:linear-gradient(#b8c8cf,#87a5b8);color:#3a4a52;display:flex;justify-content:center;align-items:center;flex-direction:column;gap:10px;z-index:100;font-size:22px;letter-spacing:6px}
#loading .sub{font-size:12px;color:#5a6a72;letter-spacing:2px}
#err{position:fixed;inset:0;background:#1a120e;color:#e8a0a0;display:none;justify-content:center;align-items:center;font-size:14px;padding:30px;text-align:center;z-index:200;white-space:pre-wrap}
canvas{display:block;width:100vw;height:100dvh}
/* HUD */
#hud{position:fixed;left:12px;bottom:12px;z-index:50;color:#f5efe0;font-size:14px;text-shadow:0 1px 3px rgba(0,0,0,.6);pointer-events:none}
#hud .realm{font-size:18px;letter-spacing:3px;color:#ffe8b0}
#hud .xiu{opacity:.85;font-size:12px}
#hint{position:fixed;left:50%;bottom:16%;transform:translateX(-50%);z-index:50;color:#fff;font-size:16px;letter-spacing:4px;text-shadow:0 1px 4px rgba(0,0,0,.7);display:none}
#medit{position:fixed;right:14px;bottom:14px;z-index:50;display:none}
#medit button{background:rgba(20,30,25,.55);color:#ffe8b0;border:1px solid rgba(255,232,176,.4);border-radius:6px;padding:10px 18px;font-family:inherit;font-size:15px;letter-spacing:4px;backdrop-filter:blur(4px)}
#medit button:active{background:rgba(60,80,60,.7)}
#title{position:fixed;top:18px;left:50%;transform:translateX(-50%);color:rgba(245,239,224,.9);font-size:15px;letter-spacing:10px;text-shadow:0 1px 4px rgba(0,0,0,.4);pointer-events:none}
</style>
</head>
<body>
<div id="loading">江湖山庄<div class="sub">正在营造…</div></div>
<div id="err"></div>
<div id="title">江 湖 山 庄</div>
<div id="hud"><div class="realm">—</div><div class="xiu">修为 0</div></div>
<div id="hint"></div>
<div id="medit"><button id="meditBtn">打 坐</button></div>
<script type="importmap">{"imports":{"three":"./lib/three.module.js"}}</script>
<script type="module">
import { boot } from './js/main.js';
try { boot(); document.title = '江湖山庄 · 运行中'; } catch (e) {
  document.title = '江湖山庄 · 启动失败';
  const el = document.getElementById('err');
  el.style.display = 'flex'; el.textContent = '启动失败：' + (e && e.message || e);
  document.getElementById('loading').style.display = 'none';
  console.error(e);
}
window.addEventListener('error', e => { document.title = '江湖山庄 · 运行错误'; });
</script>
</body>
</html>
