name: Smoke Test

on:
  push:
    branches: [main, phase-1, dev]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: HTML 结构完整
        run: grep -q "</html>" index.html

      - name: Three.js 本地模块引用且文件在仓库
        run: |
          grep -q 'lib/three.module.js' index.html
          test -f lib/three.module.js

      - name: ES 模块入口存在
        run: |
          test -f js/main.js
          grep -q "js/main.js" index.html
          grep -q "export function boot" js/main.js

      - name: 渲染循环入口存在
        run: grep -q "requestAnimationFrame" js/main.js

      - name: 世界与建筑模块在位
        run: |
          test -f js/world.js
          test -f js/architecture.js
          test -f js/meditation.js

      - name: 核心数值资产在位
        run: |
          test -f skills.js
          test -f fate.js
