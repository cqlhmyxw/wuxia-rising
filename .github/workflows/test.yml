name: Smoke Test

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: HTML 结构完整
        run: grep -q "</html>" index.html

      - name: Three.js 本地引用且文件在仓库（线上白屏根因防线）
        run: |
          grep -q 'src="./lib/three.min.js"' index.html
          test -f lib/three.min.js

      - name: canvas 变量已定义（触摸/摇杆 ReferenceError 防线）
        run: grep -qE "var canvas\s*=\s*renderer\.domElement" index.html

      - name: 游戏循环入口存在
        run: grep -q "animate();" index.html

      - name: 核心数值资产在位
        run: |
          test -f skills.js
          test -f fate.js
