name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

# 串行化部署，避免连续提交并发抢 ref 导致 gh-pages 推送被拒
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          exclude_assets: '.github,app-assets'
          force_orphan: true
